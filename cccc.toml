# Configuration for cccc, the Cognitive / Cyclomatic Complexity analyzer.
# https://github.com/moznion/cccc
#
# Local run (the target paths are command-line only):
#   cccc --table src pkg dev/metricsifter_service
#   cccc --top-cognitive 20 --table src pkg dev/metricsifter_service
#
# CI runs the same command through moznion/cccc-action
# (.github/workflows/complexity.yml) and picks this file up automatically.

# Gate on production code only; tests and test scaffolding are left out.
exclude = [
  "*.test.ts",
  "*.test.tsx",
  "*_test.go",
  "test_*.py",
  "**/__mocks__/**",
  "testSetup.ts",
]

# Backstop: cccc exits non-zero when any single function exceeds these.
#
# These limits are not a score to chase. max-cognitive came down 47 -> 25 -> 20
# while the worst outliers were refactored, and the staged reduction stops
# here. From now on complexity is tracked as a trend instead: the Complexity
# workflow reports cccc's summary per component to octocov
# (.octocov.complexity.yml), which comments the before/after values on pull
# requests and keeps a report per push to main. Watch for a steady rise or a
# sudden jump rather than the absolute number, and use
# `cccc --top-cognitive 20 --table src pkg dev/metricsifter_service` to find
# the hotspots behind it.
#
# Both limits sit at today's worst function, so they only stop new extreme
# outliers. Change them deliberately, not as part of an unrelated refactor.
max-cognitive  = 20
max-cyclomatic = 26
