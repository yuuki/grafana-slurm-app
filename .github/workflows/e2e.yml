name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: 'npm'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: go build -o dist/gpx_slurm_app_linux_amd64 ./pkg

      - name: Prepare Prometheus data directory
        run: |
          rm -rf dev/prometheus-data
          mkdir -p dev/prometheus-data
          chmod 0777 dev/prometheus-data

      - name: Start services
        run: docker compose -f docker-compose.yaml -f docker-compose.e2e.yaml up -d --wait

      - name: Discover Grafana URL
        run: |
          GRAFANA_PORT="$(docker compose -f docker-compose.yaml -f docker-compose.e2e.yaml port grafana 3000 | sed -E 's/.*:([0-9]+)$/\1/')"
          echo "GRAFANA_PORT=${GRAFANA_PORT}" >> "$GITHUB_ENV"
          echo "GRAFANA_URL=http://127.0.0.1:${GRAFANA_PORT}" >> "$GITHUB_ENV"

      - name: Wait for Grafana
        run: |
          until curl -sf "${GRAFANA_URL}/api/health" > /dev/null 2>&1; do
            sleep 2
          done

      - name: Run E2E tests
        run: npx playwright test

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.e2e.yaml down -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
