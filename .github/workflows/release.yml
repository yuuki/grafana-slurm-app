name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

# Release jobs restore no caches: a poisoned cache entry would end up in the
# published plugin archive.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test frontend
        run: npm run test:ci

      - name: Vet backend
        run: go vet ./pkg/...

      - name: Test backend
        run: go test ./pkg/... -cover

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # gh release create publishes the release and uploads the plugin archive
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # the release is created with gh and GH_TOKEN, not git push

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o dist/gpx_slurm_app_linux_amd64 ./pkg

      - name: Build backend (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go build -o dist/gpx_slurm_app_linux_arm64 ./pkg

      - name: Package plugin
        run: |
          PLUGIN_ID="yuuki-slurm-app"
          TAG="${GITHUB_REF#refs/tags/v}"
          ARCHIVE="${PLUGIN_ID}-${TAG}.zip"

          mv dist "${PLUGIN_ID}"
          zip -r "${ARCHIVE}" "${PLUGIN_ID}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            "${ARCHIVE}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
